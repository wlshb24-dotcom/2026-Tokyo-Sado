                    initialCashJPY: parsed.initialCashJPY ?? 50000,
                    initialSuicaJPY: parsed.initialSuicaJPY ?? 5000,
                    budgets: parsed.budgets ?? { food: 8000, shopping: 12000, accommodation: 5000, transport: 3000, other: 2000 }

            const [eventName, setEventName] = useState('');
            const [eventType, setEventType] = useState('spot');
            const [eventLocation, setEventLocation] = useState('');

            const getTypeTag = (type) => {
                switch(type) {
                    case 'transport': return <span className="bg-orange-100 text-orange-700 text-xs px-2 py-0.5 rounded-md font-medium border border-orange-200">🚆 交通</span>;
                    case 'hotel': return <span className="bg-purple-100 text-purple-700 text-xs px-2 py-0.5 rounded-md font-medium border border-purple-200">🏨 住宿</span>;
                    case 'food': return <span className="bg-red-100 text-red-700 text-xs px-2 py-0.5 rounded-md font-medium border border-red-200">🍜 餐飲</span>;
                    case 'spot': return <span className="bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded-md font-medium border border-green-200">📸 景點</span>;
                    default: return null;
                }
            };

            const handleAddDay = () => {
                const nextDayNum = itinerary.length + 1;
                const newDay = {
                    day: nextDayNum,
                    date: `Day ${nextDayNum}`,
                    title: `第 ${nextDayNum} 天行程`,
                    events: []
                };
                const updated = [...itinerary, newDay];
                setItinerary(updated);
                localStorage.setItem('userItinerary', JSON.stringify(updated));
                setSelectedDayIndex(updated.length - 1);
            };

            const handleDeleteDay = (dayIdx) => {
                if (window.confirm && !confirm(`確定要刪除 Day ${itinerary[dayIdx].day} 的整天行程嗎？`)) return;
                const updated = itinerary.filter((_, idx) => idx !== dayIdx).map((day, idx) => ({
                    ...day,
                    day: idx + 1
                }));
                setItinerary(updated);
                localStorage.setItem('userItinerary', JSON.stringify(updated));
                if (selectedDayIndex >= updated.length) {
                    setSelectedDayIndex(Math.max(0, updated.length - 1));
                }
            };

            const openAddEventModal = () => {
                setEventTime('10:00');
                setEventName('');
                setEventType('spot');
                setEventLocation('');
                setEventNote('');
                setEditingEventIndex(null);
                setIsEditingEvent(true);
            };

            const openEditEventModal = (eventIdx) => {
                const ev = itinerary[selectedDayIndex].events[eventIdx];
                setEventTime(ev.time || '10:00');
                setEventName(ev.name || '');
                setEventType(ev.type || 'spot');
                setEventLocation(ev.location || '');
                setEventNote(ev.note || '');
                setEditingEventIndex(eventIdx);
                setIsEditingEvent(true);
            };

            const handleSaveEvent = () => {
                if (!eventName.trim()) return;
                const newEventObj = {
                    time: eventTime,
                    name: eventName,
                    type: eventType,
                    location: eventLocation,
                    note: eventNote
                };

                const updatedItinerary = [...itinerary];
                const currentEvents = [...updatedItinerary[selectedDayIndex].events];

                if (editingEventIndex === null) {
                    currentEvents.push(newEventObj);
                } else {
                    currentEvents[editingEventIndex] = newEventObj;
                }

                currentEvents.sort((a, b) => a.time.localeCompare(b.time));

                updatedItinerary[selectedDayIndex] = {
                    ...updatedItinerary[selectedDayIndex],
                    events: currentEvents
                };

                setItinerary(updatedItinerary);
                localStorage.setItem('userItinerary', JSON.stringify(updatedItinerary));
                setIsEditingEvent(false);
            };

            const handleDeleteEvent = (eventIdx) => {
                const updatedItinerary = [...itinerary];
                const currentEvents = updatedItinerary[selectedDayIndex].events.filter((_, idx) => idx !== eventIdx);
                updatedItinerary[selectedDayIndex] = {
                    ...updatedItinerary[selectedDayIndex],
                    events: currentEvents
                };
                setItinerary(updatedItinerary);
                localStorage.setItem('userItinerary', JSON.stringify(updatedItinerary));
            };

            return (
                <div className="space-y-3 pb-6">
                    {/* 頁籤頂部標題與新增按鈕 */}
                    <div className="flex justify-between items-center pb-1">
                        <h2 className="text-lg font-black text-gray-800">旅遊行程表</h2>
                        <button 
                            onClick={handleAddDay} 
                            className="bg-blue-50 text-blue-600 border border-blue-200 px-3 py-1 rounded-lg text-xs font-bold hover:bg-blue-100 active:scale-95 transition-all flex items-center gap-1 shadow-sm"
                        >
                            ➕ 新增天數
                        </button>
                    </div>
                    
                    {itinerary.length === 0 && (
                        <div className="text-center py-10 bg-white rounded-2xl border border-dashed border-gray-300 p-6">
                            <p className="text-gray-500 mb-3 text-sm">目前沒有任何行程資料</p>
                            <button onClick={handleAddDay} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md hover:bg-blue-700">
                                建立第一天行程 (Day 1)
                            </button>
                        </div>
                    )}

                    {itinerary.length > 0 && (
                        <>
                            {/* 天數水平滾動切換選單 */}
                            <div className="flex gap-2 overflow-x-auto py-1 hide-scrollbar -mx-1 px-1">
                                {itinerary.map((dayPlan, idx) => (
                                    <button 
                                        key={idx}
                                        onClick={() => setSelectedDayIndex(idx)}
                                        className={`whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm ${
                                            selectedDayIndex === idx 
                                            ? 'bg-blue-600 text-white ring-2 ring-blue-300' 
                                            : 'bg-white text-gray-600 border border-gray-200 hover:bg-blue-50'
                                        }`}
                                    >
                                        Day {dayPlan.day}
                                    </button>
                                ))}
                            </div>

                            {/* 選定天數的詳細內容 */}
                            {itinerary[selectedDayIndex] && (
                                <div className="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
                                    <div className="bg-blue-50/80 px-4 py-3 border-b border-blue-100 flex justify-between items-center">
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2">
                                                <h3 className="font-bold text-blue-900 text-base">Day {itinerary[selectedDayIndex].day}</h3>
                                                <span className="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-medium">
                                                    {itinerary[selectedDayIndex].events.length} 個行程
                                                </span>
                                            </div>
                                            <p className="text-xs text-blue-600 mt-0.5">{itinerary[selectedDayIndex].date} · {itinerary[selectedDayIndex].title}</p>
                                        </div>
                                        <div className="flex gap-1.5 items-center">
                                            <button 
                                                onClick={openAddEventModal}
                                                className="bg-blue-600 text-white px-2.5 py-1 rounded-lg text-xs font-bold hover:bg-blue-700 shadow-sm transition-transform active:scale-95"
                                            >
                                                ➕ 加行程
                                            </button>
                                            <button 
                                                onClick={() => handleDeleteDay(selectedDayIndex)}
                                                className="text-gray-400 hover:text-red-500 p-1.5 rounded hover:bg-red-50 text-xs"
                                                title="刪除此天"
                                            >
                                                🗑️
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div className="p-4 space-y-4">
                                        {itinerary[selectedDayIndex].events.length === 0 && (
                                            <p className="text-center text-gray-400 text-xs py-8 border border-dashed border-gray-200 rounded-xl">
                                                今天還沒有安排行程，點擊右上角「➕ 加行程」點選建立！
                                            </p>
                                        )}

                                        {itinerary[selectedDayIndex].events.map((event, eIdx) => (
                                            <div key={eIdx} className="flex gap-3 relative">
                                                <div className="flex flex-col items-center">
                                                    <div className="w-2.5 h-2.5 rounded-full bg-blue-500 mt-1.5 z-10 ring-4 ring-blue-50"></div>
                                                    {eIdx !== itinerary[selectedDayIndex].events.length - 1 && <div className="w-0.5 h-full bg-gray-200 absolute top-3"></div>}
                                                </div>
                                                <div className="flex-1 bg-gray-50/90 hover:bg-gray-50 p-3 rounded-xl border border-gray-100 transition-colors">
                                                    <div className="flex justify-between items-start mb-1">
                                                        <div className="flex items-center gap-2 flex-wrap">
                                                            <span className="text-xs font-bold text-gray-700 bg-white px-1.5 py-0.5 rounded border border-gray-200">{event.time}</span>
                                                            {getTypeTag(event.type)}
                                                        </div>
                                                        <div className="flex gap-1 items-center">
                                                            <button onClick={() => openEditEventModal(eIdx)} className="text-gray-400 hover:text-blue-600 p-1 text-xs" title="編輯">
                                                                ✏️
                                                            </button>
                                                            <button onClick={() => handleDeleteEvent(eIdx)} className="text-gray-300 hover:text-red-500 p-1 text-xs" title="刪除">
                                                                ❌
                                                            </button>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="mt-1">
                                                        <span className="font-bold text-gray-900 text-sm">{event.name}</span>
                                                    </div>
                                                    
                                                    {/* 明顯的地圖導航按鈕 (如果該行程有輸入位置) */}
                                                    {event.location && (
                                                        <div 
                                                            onClick={() => openMap(event.location)}
                                                            className="mt-1.5 flex items-center gap-1 text-[11px] font-bold text-blue-700 bg-blue-100/60 px-2 py-1 rounded-md border border-blue-200 cursor-pointer hover:bg-blue-200 transition-colors w-max active:scale-95"
                                                        >
                                                            📍 <span className="underline decoration-blue-400 underline-offset-2">{event.location}</span> - 點擊導航
                                                        </div>
                                                    )}

                                                    {event.note && <p className="text-xs text-gray-500 mt-2 bg-white p-2 rounded-lg border border-gray-100 leading-relaxed">{event.note}</p>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </>
                    )}

                    {/* 新增/編輯行程彈窗 */}
                    {isEditingEvent && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl space-y-4">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-gray-800 text-base">
                                        {editingEventIndex === null ? '➕ 新增行程' : '✏️ 編輯行程'}
                                    </h3>
                                    <button onClick={() => setIsEditingEvent(false)} className="text-gray-400 hover:text-gray-600 text-lg font-bold">✕</button>
                                </div>

                                <div className="space-y-3 text-sm">
                                    <div className="flex gap-2">
                                        <div className="w-1/3">
                                            <label className="block text-xs font-bold text-gray-500 mb-1">時間</label>
                                            <input type="time" value={eventTime} onChange={e => setEventTime(e.target.value)} className="w-full p-2 border rounded-lg bg-gray-50 font-medium text-xs focus:ring-2 focus:ring-blue-500 outline-none" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-gray-500 mb-1">類型</label>
                                            <select value={eventType} onChange={e => setEventType(e.target.value)} className="w-full p-2 border rounded-lg bg-gray-50 font-medium text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                                                <option value="spot">📸 景點</option>
                                                <option value="food">🍜 餐飲</option>
                                                <option value="hotel">🏨 住宿</option>
                                                <option value="transport">🚆 交通</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">行程名稱 *</label>
                                        <input type="text" placeholder="例如: 淺草寺參拜" value={eventName} onChange={e => setEventName(e.target.value)} className="w-full p-2 border rounded-lg bg-gray-50 text-xs focus:ring-2 focus:ring-blue-500 outline-none" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">地標 / 地址 (輸入後將自動產生導航按鈕)</label>
                                        <input type="text" placeholder="例如: 淺草寺" value={eventLocation} onChange={e => setEventLocation(e.target.value)} className="w-full p-2 border rounded-lg bg-gray-50 text-xs focus:ring-2 focus:ring-blue-500 outline-none" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">備註 / 提醒事項</label>
                                        <textarea rows="2" placeholder="例如: 記得抽號碼牌" value={eventNote} onChange={e => setEventNote(e.target.value)} className="w-full p-2 border rounded-lg bg-gray-50 text-xs focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                                    </div>
                                </div>

                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setIsEditingEvent(false)} className="w-1/2 py-2 border rounded-lg font-bold text-gray-500 hover:bg-gray-100 text-xs">取消</button>
                                    <button onClick={handleSaveEvent} className="w-1/2 py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow-sm text-xs">儲存行程</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ShoppingTab() {
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('shoppingList');
                return saved ? JSON.parse(saved) : [];
            });
            const [newItemName, setNewItemName] = useState('');
            const [newRecipient, setNewRecipient] = useState('');

            useEffect(() => {
                localStorage.setItem('shoppingList', JSON.stringify(items));
            }, [items]);

            const addItem = () => {
                if (!newItemName) return;
                const newItem = { id: Date.now(), name: newItemName, recipient: newRecipient || '自己', isBought: false };
                setItems([...items, newItem]);
                setNewItemName(''); setNewRecipient('');
            };

            const toggleBought = (id) => {
                setItems(items.map(item => item.id === id ? { ...item, isBought: !item.isBought } : item));
            };

            const deleteItem = (id) => {
                setItems(items.filter(item => item.id !== id));
            };

            return (
                <div className="space-y-4">
                    <h2 className="text-lg font-bold text-gray-800 border-b pb-2">伴手禮 & 代購清單</h2>
                    
                    <div className="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 space-y-2">
                        <input type="text" placeholder="物品名稱 (例: 薯條三兄弟)" className="w-full p-2.5 border rounded-xl bg-gray-50 text-xs outline-none focus:ring-2 focus:ring-blue-500" value={newItemName} onChange={(e) => setNewItemName(e.target.value)} />
                        <div className="flex gap-2">
                            <input type="text" placeholder="買給誰 (預設: 自己)" className="flex-1 p-2.5 border rounded-xl bg-gray-50 text-xs outline-none focus:ring-2 focus:ring-blue-500" value={newRecipient} onChange={(e) => setNewRecipient(e.target.value)} />
                            <button onClick={addItem} className="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-xs shadow-sm hover:bg-blue-700 active:scale-95 transition-all">新增</button>
                        </div>
                    </div>

                    <div className="space-y-2">
                        {items.length === 0 && <p className="text-center text-gray-400 text-xs py-8">目前購物清單是空的～</p>}
                        {items.map(item => (
                            <div key={item.id} className={`flex items-center justify-between p-3 rounded-xl border ${item.isBought ? 'bg-gray-100 border-gray-200' : 'bg-white border-blue-100 shadow-sm'}`}>
                                <div className="flex items-center gap-3">
                                    <input type="checkbox" checked={item.isBought} onChange={() => toggleBought(item.id)} className="w-4 h-4 text-blue-600 rounded" />
                                    <div>
                                        <p className={`font-bold text-sm ${item.isBought ? 'text-gray-400 line-through' : 'text-gray-800'}`}>{item.name}</p>
                                        <p className="text-[11px] text-gray-500">對象: <span className="text-blue-600 font-medium">{item.recipient}</span></p>
                                    </div>
                                </div>
                                <button onClick={() => deleteItem(item.id)} className="text-gray-300 hover:text-red-500 p-1 text-xs">
                                    ❌
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function ExpenseTab({ settings }) {
            const [expenses, setExpenses] = useState(() => {
                const saved = localStorage.getItem('expenseList');
                return saved ? JSON.parse(saved) : [];
            });
            const [amount, setAmount] = useState('');
            const [category, setCategory] = useState('食');
            const [method, setMethod] = useState('cash'); 
            const [note, setNote] = useState('');
            const [currency, setCurrency] = useState('JPY');
            
            const [expenseDate, setExpenseDate] = useState(() => {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            });

            useEffect(() => {
                localStorage.setItem('expenseList', JSON.stringify(expenses));
            }, [expenses]);

            const addExpense = () => {
                if (!amount || isNaN(amount) || amount <= 0) return;
                const newExpense = {
                    id: Date.now(),
                    amount: parseFloat(amount),
                    category,
                    method,
                    note,
                    date: expenseDate,
                    currency
                };
                setExpenses([newExpense, ...expenses]);
                setAmount('');
                setNote('');
            };

            const deleteExpense = (id) => {
                setExpenses(expenses.filter(e => e.id !== id));
            };

            const categoryMap = { '食': 'food', '購物': 'shopping', '住': 'accommodation', '交通+門票': 'transport', '其他': 'other' };

            let spentByCategoryTWD = { food: 0, shopping: 0, accommodation: 0, transport: 0, other: 0 };
            let spentCashJPY = 0;
            let spentSuicaJPY = 0;
            let spentCardJPY = 0;

            expenses.forEach(e => {
                const curr = e.currency || 'JPY';
                
                if (curr === 'JPY') {
                    if (e.method === 'cash') spentCashJPY += e.amount;
                    else if (e.method === 'suica') spentSuicaJPY += e.amount;
                    else if (e.method === 'card') spentCardJPY += e.amount;
                }

                const amountTWD = curr === 'TWD' ? e.amount : e.amount * (settings.exchangeRate || 0.215);
                const catKey = categoryMap[e.category] || 'other';
                spentByCategoryTWD[catKey] += amountTWD;
            });

            const remainingCash = (settings.initialCashJPY || 0) - spentCashJPY;
            const remainingSuica = (settings.initialSuicaJPY || 0) - spentSuicaJPY;
            const creditCardBillTWD = spentCardJPY * (settings.exchangeRate || 0.215);

            const totalBudgetTWD = Object.values(settings.budgets || {}).reduce((a, b) => a + b, 0);
            const totalSpentTWD = Object.values(spentByCategoryTWD).reduce((a, b) => a + b, 0);
            const totalRemainingTWD = totalBudgetTWD - totalSpentTWD;

            const getRemainingBudget = (catKey) => {
                const budgetTWD = settings.budgets[catKey] || 0;
                const spentTWD = spentByCategoryTWD[catKey];
                return budgetTWD - spentTWD;
            };

            const getCategoryIcon = (cat) => {
                switch(cat) {
                    case '食': return '🍜';
                    case '購物': return '🛍️';
                    case '住': return '🏨';
                    case '交通+門票': return '🎫';
                    case '其他': return '🛒';
                    default: return '💰';
                }
            };

            const getMethodName = (m) => {
                if(m === 'cash') return '現金';
                if(m === 'suica') return '西瓜卡';
                if(m === 'card') return '刷卡';
                return m;
            };

            const groupedExpenses = expenses.reduce((acc, curr) => {
                if (!acc[curr.date]) acc[curr.date] = [];
                acc[curr.date].push(curr);
                return acc;
            }, {});
            
            const sortedDates = Object.keys(groupedExpenses).sort((a, b) => new Date(b) - new Date(a));

            return (
                <div className="pb-8 space-y-5">
                    <h2 className="text-lg font-bold text-gray-800 border-b pb-2">記帳與預算</h2>
                    
                    <div className="bg-gradient-to-br from-blue-700 to-indigo-700 p-4 rounded-2xl shadow-md text-white">
                        <div className="mb-3">
                            <p className="text-blue-200 text-xs mb-0.5">💳 回台應繳卡費 (TWD)</p>
                            <p className="text-2xl font-black text-white">NT$ {Math.round(creditCardBillTWD).toLocaleString()}</p>
                        </div>
                        <div className="flex justify-between border-t border-blue-400/40 pt-2.5 text-xs">
                            <div>
                                <p className="text-blue-200 mb-0.5">現金剩餘 (JPY)</p>
                                <p className="font-bold text-sm">¥ {remainingCash.toLocaleString()}</p>
                            </div>
                            <div className="text-right">
                                <p className="text-blue-200 mb-0.5">西瓜卡剩餘 (JPY)</p>
                                <p className="font-bold text-sm">¥ {remainingSuica.toLocaleString()}</p>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
                        <div>
                            <p className="text-gray-500 text-xs font-bold mb-0.5">總預算剩餘 (TWD)</p>
                            <p className={`text-xl font-black ${totalRemainingTWD < 0 ? 'text-red-500' : 'text-green-600'}`}>
                                NT$ {Math.round(totalRemainingTWD).toLocaleString()} <span className="text-xs font-normal text-gray-400">/ {totalBudgetTWD.toLocaleString()}</span>
                            </p>
                        </div>
                        <div className="grid grid-cols-2 gap-x-3 gap-y-2 pt-1">
                            {Object.keys(categoryMap).map(catName => {
                                const catKey = categoryMap[catName];
                                const remain = Math.round(getRemainingBudget(catKey));
                                const budget = settings.budgets[catKey] || 1;
                                const percent = Math.min(100, Math.max(0, ((budget - remain) / budget) * 100));
                                
                                return (
                                    <div key={catKey}>
                                        <div className="flex justify-between text-[11px] mb-1">
                                            <span className="text-gray-600 font-medium">{catName}</span>
                                            <span className={remain < 0 ? 'text-red-500 font-bold' : 'text-gray-500'}>剩 {remain}</span>
                                        </div>
                                        <div className="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                                            <div className={`h-1.5 rounded-full ${remain < 0 ? 'bg-red-500' : 'bg-blue-500'}`} style={{width: `${percent}%`}}></div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* 輸入表單 */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-blue-100 space-y-2.5 bg-blue-50/20">
                        <input type="date" value={expenseDate} onChange={e => setExpenseDate(e.target.value)} className="w-full p-2 border border-gray-200 rounded-xl bg-white text-xs font-medium text-gray-700 outline-none" />
                        
                        <div className="flex gap-2">
                            <select value={category} onChange={e => setCategory(e.target.value)} className="w-1/3 p-2 border border-gray-200 rounded-xl bg-white text-xs outline-none">
                                <option value="食">食 🍜</option>
                                <option value="購物">購物 🛍️</option>
                                <option value="住">住 🏨</option>
                                <option value="交通+門票">交/票 🎫</option>
                                <option value="其他">其他 🛒</option>
                            </select>
                            <select value={currency} onChange={e => setCurrency(e.target.value)} className="w-1/4 p-2 border border-gray-200 rounded-xl bg-white text-xs outline-none">
                                <option value="JPY">日圓</option>
                                <option value="TWD">台幣</option>
                            </select>
                            <input type="number" placeholder="金額" className="flex-1 p-2 border border-gray-200 rounded-xl bg-white text-xs outline-none focus:ring-2 focus:ring-blue-500" value={amount} onChange={e => setAmount(e.target.value)} />
                        </div>
                        <div className="flex gap-2">
                            <select value={method} onChange={e => setMethod(e.target.value)} className="w-1/3 p-2 border border-gray-200 rounded-xl bg-white text-xs outline-none">
                                <option value="cash">現金</option>
                                <option value="suica">西瓜卡</option>
                                <option value="card">刷卡</option>
                            </select>
                            <input type="text" placeholder="備註 (例: 晚餐拉麵)" className="flex-1 p-2 border border-gray-200 rounded-xl bg-white text-xs outline-none focus:ring-2 focus:ring-blue-500" value={note} onChange={e => setNote(e.target.value)} />
                        </div>
                        <button onClick={addExpense} className="w-full bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl font-bold text-xs shadow-sm transition-transform active:scale-95">新增一筆花費</button>
                    </div>

                    {/* 歷史紀錄 */}
                    <div className="space-y-4">
                        {sortedDates.length === 0 && <p className="text-center text-gray-400 text-xs py-6 bg-gray-50 rounded-xl border border-dashed border-gray-200">目前尚無記帳紀錄！</p>}
                        
                        {sortedDates.map(dateStr => {
                            const dailyJPY = groupedExpenses[dateStr].filter(e => (e.currency || 'JPY') === 'JPY').reduce((sum, e) => sum + e.amount, 0);
                            const dailyTWD = groupedExpenses[dateStr].filter(e => e.currency === 'TWD').reduce((sum, e) => sum + e.amount, 0);
                            
                            return (
                                <div key={dateStr} className="space-y-2">
                                    <div className="flex justify-between items-end border-b pb-1 px-1">
                                        <h3 className="text-xs font-bold text-gray-600">{dateStr}</h3>
                                        <span className="text-[11px] font-bold text-gray-400">
                                            {dailyJPY > 0 && `¥ ${dailyJPY.toLocaleString()} `}
                                            {dailyTWD > 0 && `NT$ ${dailyTWD.toLocaleString()}`}
                                            {(dailyJPY === 0 && dailyTWD === 0) && '¥ 0'}
                                        </span>
                                    </div>
                                    
                                    {groupedExpenses[dateStr].map(e => {
                                        const curr = e.currency || 'JPY';
                                        return (
                                        <div key={e.id} className="bg-white p-3 rounded-xl border border-gray-100 shadow-sm flex justify-between items-center">
                                            <div className="flex gap-2.5 items-center">
                                                <div className="text-xl bg-gray-50 p-1.5 rounded-lg">{getCategoryIcon(e.category)}</div>
                                                <div>
                                                    <p className="font-bold text-gray-800 text-xs mb-0.5">{e.note || e.category}</p>
                                                    <span className={`text-[10px] px-1.5 py-0.5 rounded font-medium ${e.method === 'card' ? 'bg-red-50 text-red-600' : 'bg-blue-50 text-blue-600'}`}>
                                                        {getMethodName(e.method)}
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <span className={`font-bold text-sm ${e.method === 'card' ? 'text-red-600' : 'text-gray-800'}`}>
                                                    {curr === 'TWD' ? 'NT$' : '¥'}{e.amount.toLocaleString()}
                                                </span>
                                                <button onClick={() => deleteExpense(e.id)} className="text-gray-300 hover:text-red-500 p-1 text-xs">❌</button>
                                            </div>
                                        </div>
                                    )})}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function SplitBillTab() {
            const [splits, setSplits] = useState(() => {
                const saved = localStorage.getItem('splitList');
                return saved ? JSON.parse(saved) : [];
            });
            const [payer, setPayer] = useState('自己');
            const [debtor, setDebtor] = useState('');
            const [item, setItem] = useState('');
            const [amount, setAmount] = useState('');
            const [currency, setCurrency] = useState('JPY');

            useEffect(() => {
                localStorage.setItem('splitList', JSON.stringify(splits));
            }, [splits]);

            const addSplit = () => {
                if (!debtor || !amount || !item) return;
                const newSplit = {
                    id: Date.now(),
                    payer: payer || '自己',
                    debtor,
                    item,
                    amount: parseFloat(amount),
                    currency,
                    date: new Date().toLocaleDateString()
                };
                setSplits([newSplit, ...splits]);
                setDebtor(''); setItem(''); setAmount('');
            };

            const deleteSplit = (id) => {
                setSplits(splits.filter(s => s.id !== id));
            };

            return (
                <div className="pb-8 space-y-4">
                    <h2 className="text-lg font-bold text-gray-800 border-b pb-2">代墊分帳本</h2>
                    
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-2.5">
                        <div className="flex gap-2">
                            <input type="text" placeholder="誰代墊? (例: 自己)" className="w-1/3 p-2 border border-gray-200 rounded-xl bg-gray-50 text-xs focus:ring-2 focus:ring-blue-500 outline-none" value={payer} onChange={e => setPayer(e.target.value)} />
                            <input type="text" placeholder="欠款人姓名" className="flex-1 p-2 border border-gray-200 rounded-xl bg-gray-50 text-xs focus:ring-2 focus:ring-blue-500 outline-none" value={debtor} onChange={e => setDebtor(e.target.value)} />
                        </div>
                        <div className="flex gap-2">
                            <input type="text" placeholder="代墊項目 (例: 門票)" className="flex-1 p-2 border border-gray-200 rounded-xl bg-gray-50 text-xs focus:ring-2 focus:ring-blue-500 outline-none" value={item} onChange={e => setItem(e.target.value)} />
                            <select value={currency} onChange={e => setCurrency(e.target.value)} className="w-1/4 p-2 border border-gray-200 rounded-xl bg-gray-50 text-xs outline-none">
                                <option value="JPY">日圓</option>
                                <option value="TWD">台幣</option>
                            </select>
                            <input type="number" placeholder="金額" className="w-1/3 p-2 border border-gray-200 rounded-xl bg-gray-50 text-xs focus:ring-2 focus:ring-blue-500 outline-none" value={amount} onChange={e => setAmount(e.target.value)} />
                        </div>
                        <button onClick={addSplit} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-xl font-bold text-xs shadow-sm active:scale-95 transition-all">新增一筆代墊</button>
                    </div>

                    <div className="flex justify-between items-end px-1 pt-2">
                        <h3 className="text-sm font-bold text-gray-700">未結算明細</h3>
                        <span className="text-xs text-gray-400">共 {splits.length} 筆</span>
                    </div>
                    
                    <div className="space-y-2">
                        {splits.length === 0 && <p className="text-center text-gray-400 text-xs py-6 bg-gray-50 rounded-xl border border-dashed border-gray-200">目前沒有需要分帳的紀錄！</p>}
                        {splits.map(s => (
                            <div key={s.id} className="bg-white p-3.5 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                                <div>
                                    <p className="font-bold text-gray-800 text-xs mb-1">{s.item}</p>
                                    <div className="text-[10px] text-gray-500 flex items-center gap-1">
                                        <span className="bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-medium">{s.payer}</span>
                                        <span>幫</span>
                                        <span className="bg-pink-50 text-pink-700 px-1.5 py-0.5 rounded font-medium">{s.debtor}</span>
                                        <span className="ml-1 text-gray-400">{s.date}</span>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="font-bold text-gray-800 text-sm">
                                        {(s.currency || 'JPY') === 'TWD' ? 'NT$' : '¥'}{s.amount.toLocaleString()}
                                    </span>
                                    <button onClick={() => deleteSplit(s.id)} className="text-gray-300 hover:text-green-500 p-1 text-xs" title="標記為已結清">✅</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function SettingsTab({ settings, setSettings, setItinerary }) {
            const [localSettings, setLocalSettings] = useState(settings);
            const [saveStatus, setSaveStatus] = useState('');

            const handleSettingChange = (e) => {
                const { name, value } = e.target;
                setLocalSettings(prev => ({ ...prev, [name]: parseFloat(value) || 0 }));
            };

            const handleBudgetChange = (e) => {
                const { name, value } = e.target;
                setLocalSettings(prev => ({
                    ...prev,
                    budgets: {
                        ...prev.budgets,
                        [name]: parseFloat(value) || 0
                    }
                }));
            };

            const saveSettings = () => {
                setSettings(localSettings);
                localStorage.setItem('appSettings', JSON.stringify(localSettings));
                setSaveStatus('✅ 設定已順利儲存！');
                setTimeout(() => setSaveStatus(''), 2000);
            };

            const restoreDefaultItinerary = () => {
                // IMPORTANT: 因為使用者可能已經在 App 裡修改過資料，
                // 若要套用我們剛剛在程式碼更新的新資料，要請他們點擊「還原預設行程」
                if (window.confirm && confirm("確定要還原為預設範例行程嗎？您現有的修改將會被覆蓋。")) {
                    setItinerary(dummyItinerary);
                    localStorage.setItem('userItinerary', JSON.stringify(dummyItinerary));
                    setSaveStatus('✅ 已成功還原預設行程！');
                    setTimeout(() => setSaveStatus(''), 2000);
                }
            };

            const totalBudgetTWD = Object.values(localSettings.budgets).reduce((a, b) => a + b, 0);

            return (
                <div className="pb-8 space-y-5">
                    <h2 className="text-lg font-bold text-gray-800 border-b pb-2">系統設定</h2>

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-4">
                        <h3 className="font-bold text-gray-800 text-sm flex items-center gap-1.5">💰 匯率與預算設定</h3>
                        
                        <div className="space-y-3 text-xs">
                            <div className="bg-gray-50 p-3 rounded-xl border border-gray-100 space-y-2.5">
                                <div>
                                    <label className="block text-gray-500 mb-1 font-bold">預估匯率 (例: 0.215)</label>
                                    <input type="number" step="0.001" name="exchangeRate" value={localSettings.exchangeRate} onChange={handleSettingChange} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium" />
                                </div>
                                <div className="flex gap-2">
                                    <div className="flex-1">
                                        <label className="block text-gray-500 mb-1 font-bold">攜帶現金 (日圓 ¥)</label>
                                        <input type="number" name="initialCashJPY" value={localSettings.initialCashJPY} onChange={handleSettingChange} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium" />
                                    </div>
                                    <div className="flex-1">
                                        <label className="block text-gray-500 mb-1 font-bold">西瓜卡餘額 (日圓 ¥)</label>
                                        <input type="number" name="initialSuicaJPY" value={localSettings.initialSuicaJPY} onChange={handleSettingChange} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white font-medium" />
                                    </div>
                                </div>
                            </div>

                            <div className="bg-blue-50/40 p-3 rounded-xl border border-blue-100 space-y-2.5">
                                <div className="flex justify-between items-center border-b border-blue-200/60 pb-2">
                                    <label className="block text-blue-900 font-bold">台幣分類預算 (TWD)</label>
                                    <span className="text-[11px] font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full">總額: NT$ {totalBudgetTWD.toLocaleString()}</span>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-2.5">
                                    <div>
                                        <label className="block text-gray-500 text-[11px] mb-1">🍜 食</label>
                                        <input type="number" name="food" value={localSettings.budgets.food} onChange={handleBudgetChange} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white text-xs font-medium" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-500 text-[11px] mb-1">🛍️ 購物</label>
                                        <input type="number" name="shopping" value={localSettings.budgets.shopping} onChange={handleBudgetChange} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white text-xs font-medium" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-500 text-[11px] mb-1">🏨 住</label>
                                        <input type="number" name="accommodation" value={localSettings.budgets.accommodation} onChange={handleBudgetChange} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white text-xs font-medium" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-500 text-[11px] mb-1">🎫 交通+門票</label>
                                        <input type="number" name="transport" value={localSettings.budgets.transport} onChange={handleBudgetChange} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white text-xs font-medium" />
                                    </div>
                                    <div className="col-span-2">
                                        <label className="block text-gray-500 text-[11px] mb-1">🛒 其他</label>
                                        <input type="number" name="other" value={localSettings.budgets.other} onChange={handleBudgetChange} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white text-xs font-medium" />
                                    </div>
                                </div>
                            </div>
                            
                            <button onClick={saveSettings} className="w-full bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl font-bold shadow-sm active:scale-95 transition-all text-xs">💾 儲存預算與匯率設定</button>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-2">
                        <h3 className="font-bold text-gray-800 text-xs">🛠️ 快捷工具</h3>
                        <p className="text-[11px] text-gray-500">如果沒有看見最新版的預設行程內容，可以點擊下方按鈕強制還原。</p>
                        <button onClick={restoreDefaultItinerary} className="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 p-2 rounded-xl text-xs font-bold active:scale-95 transition-all">
                            ↺ 重新載入最新預設行程
                        </button>
                    </div>

                    {saveStatus && (
                        <div className="fixed top-16 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-xl shadow-lg z-50 text-xs font-bold text-white bg-green-500 animate-bounce">
                            {saveStatus}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
